<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <title>Simulador Mundial 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 30px;
    }

    #grupos-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .grupo-bloque {
      background: white;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .grupo-bloque h2 {
      color: white;
      background-color: #16213e;
      margin: -16px -16px 12px -16px;
      padding: 10px 16px;
      border-radius: 10px 10px 0 0;
      font-size: 15px;
    }

    .grupo-contenido {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background-color: #e94560;
      color: white;
    }

    th,
    td {
      padding: 5px 6px;
      text-align: center;
    }

    td:nth-child(2) {
      text-align: left;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background-color: #f5f5f5;
    }

    .partidos-lista {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .partido-fila {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    .partido-equipo {
      flex: 1;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .partido-equipo.visitante {
      text-align: left;
    }

    .partido-score {
      width: 28px;
      height: 24px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .partido-sep {
      color: #999;
      font-size: 11px;
    }

    #terceros-section {
      margin-top: 30px;
      background: white;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    #terceros-section h2 {
      color: white;
      background-color: #e67e22;
      margin: -16px -16px 12px -16px;
      padding: 10px 16px;
      border-radius: 10px 10px 0 0;
      font-size: 15px;
    }

    #terceros-section table {
      font-size: 13px;
    }

    #terceros-section thead {
      background-color: #e67e22;
    }

    #controles {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    #controles button {
      padding: 10px 24px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #btn-reiniciar {
      background-color: #c0392b;
      color: white;
    }

    #btn-reiniciar:hover {
      background-color: #a93226;
    }

    #btn-siguiente {
      background-color: #27ae60;
      color: white;
    }

    #btn-siguiente:not(:disabled) {
      background-color: #27ae60;
      cursor: pointer;
      opacity: 1;
    }

    #btn-siguiente:hover:not(:disabled) {
      background-color: #1e8449;
    }

    #btn-siguiente:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    #bracket-container {
      overflow-x: auto;
      padding-bottom: 20px;
    }

    .bracket-rondas {
      display: flex;
      gap: 0;
      min-width: 1200px;
    }

    .bracket-mitad {
      display: flex;
      flex: 1;
    }

    .bracket-mitad.derecha {
      flex-direction: row-reverse;
    }

    .ronda-col {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      min-width: 200px;
      padding: 4px;
    }

    .ronda-titulo {
      text-align: center;
      color: white;
      background-color: #16213e;
      padding: 5px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .cruce-card {
      background: white;
      border-radius: 8px;
      padding: 6px 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      margin: 3px 0;
      border-left: 3px solid #16213e;
    }

    .cruce-linea {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .cruce-linea:last-of-type {
      border-bottom: none;
    }

    .cruce-linea.ganador {
      background-color: #d4edda;
      border-radius: 4px;
      padding: 3px 4px;
    }

    .cruce-nombre {
      flex: 1;
      font-size: 11px;
      font-weight: bold;
      color: #1a1a2e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }

    .cruce-input {
      width: 30px;
      height: 22px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .penales-row {
      display: none;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
      font-size: 10px;
      color: #666;
    }

    .penales-row.visible {
      display: flex;
    }

    .penales-check {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      font-size: 10px;
    }

    .bracket-final {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      padding: 8px;
      gap: 16px;
    }

    .final-card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      border-top: 4px solid #e94560;
      width: 100%;
      text-align: center;
    }

    .final-titulo {
      font-size: 11px;
      font-weight: bold;
      color: #e94560;
      margin-bottom: 6px;
    }

    .tercer-titulo {
      color: #e67e22;
      border-top-color: #e67e22;
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 16px;
      }

      #grupos-container {
        grid-template-columns: 1fr;
      }

      .grupo-contenido {
        grid-template-columns: 1fr;
      }

      .partidos-lista {
        margin-top: 12px;
      }

      .partido-equipo {
        font-size: 10px;
        max-width: 80px;
      }

      #terceros-section table {
        font-size: 11px;
      }

      #terceros-section th,
      #terceros-section td {
        padding: 3px 4px;
      }

      #controles {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      #controles button {
        width: 80%;
      }

      #bracket-container {
        overflow-x: scroll;
        -webkit-overflow-scrolling: touch;
      }

      .bracket-rondas {
        min-width: 900px;
      }

      .ronda-col {
        min-width: 150px;
      }

      .cruce-nombre {
        max-width: 80px;
        font-size: 10px;
      }

      .cruce-input {
        width: 26px;
        height: 20px;
        font-size: 11px;
      }

      .bracket-final {
        min-width: 130px;
      }

      .final-card {
        padding: 6px;
      }

      #controles-eliminatorias {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      #controles-eliminatorias button {
        width: 80%;
      }
    }

    @media (max-width: 480px) {
      .partido-fila {
        font-size: 10px;
      }

      .partido-score {
        width: 24px;
        height: 22px;
        font-size: 11px;
      }

      table {
        font-size: 11px;
      }

      th,
      td {
        padding: 3px 4px;
      }
    }

    #btn-captura-grupos {
      background-color: #2980b9;
      color: white;
    }

    #btn-captura-grupos:hover {
      background-color: #2471a3;
    }
  </style>
</head>

    function calcularPosiciones(letra) {
      const grupo = GRUPOS[letra];

      const equipos = grupo.equipos.map(function (nombre, i) {
        return {
          nombre: nombre,
          bandera: grupo.banderas[i],
          indice: i,
          pts: 0, j: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0
        };
      });

      // Guardar resultado de cada partido para head-to-head
      const resultados = {};
      PARTIDOS.forEach(function ([hi, ai], mi) {
        const inputH = document.getElementById('score-' + letra + '-' + mi + '-h');
        const inputA = document.getElementById('score-' + letra + '-' + mi + '-a');
        const golesH = parseInt(inputH.value);
        const golesA = parseInt(inputA.value);

        if (isNaN(golesH) || isNaN(golesA)) return;

        // Guardar el resultado del partido para consulta head-to-head
        resultados[hi + '-' + ai] = { golesH, golesA };

        equipos[hi].j++; equipos[ai].j++;
        equipos[hi].gf += golesH; equipos[hi].gc += golesA;
        equipos[ai].gf += golesA; equipos[ai].gc += golesH;

        if (golesH > golesA) {
          equipos[hi].pts += 3; equipos[hi].g++; equipos[ai].p++;
        } else if (golesA > golesH) {
          equipos[ai].pts += 3; equipos[ai].g++; equipos[hi].p++;
        } else {
          equipos[hi].pts += 1; equipos[hi].e++;
          equipos[ai].pts += 1; equipos[ai].e++;
        }
      });

      // Función head-to-head: calcula stats solo entre un subgrupo de equipos
      function headToHead(grupo) {
        const indices = grupo.map(e => e.indice);
        const stats = {};
        indices.forEach(i => stats[i] = { pts: 0, gf: 0, gc: 0 });

        indices.forEach(function (hi) {
          indices.forEach(function (ai) {
            if (hi === ai) return;
            const clave = hi + '-' + ai;
            if (!resultados[clave]) return;
            const { golesH, golesA } = resultados[clave];

            stats[hi].gf += golesH; stats[hi].gc += golesA;
            stats[ai].gf += golesA; stats[ai].gc += golesH;

            if (golesH > golesA) {
              stats[hi].pts += 3;
            } else if (golesA > golesH) {
              stats[ai].pts += 3;
            } else {
              stats[hi].pts += 1;
              stats[ai].pts += 1;
            }
          });
        });
        return stats;
      }

      // Ordenar con todos los criterios
      equipos.sort(function (a, b) {
        // Primero por puntos generales
        if (b.pts !== a.pts) return b.pts - a.pts;

        // Empate en puntos: aplicar head-to-head entre los empatados
        const hth = headToHead([a, b]);
        const ptsA = hth[a.indice].pts;
        const ptsB = hth[b.indice].pts;

        // a) Puntos head-to-head
        if (ptsB !== ptsA) return ptsB - ptsA;

        // b) DG head-to-head
        const dgHthA = hth[a.indice].gf - hth[a.indice].gc;
        const dgHthB = hth[b.indice].gf - hth[b.indice].gc;
        if (dgHthB !== dgHthA) return dgHthB - dgHthA;

        // c) GF head-to-head
        if (hth[b.indice].gf !== hth[a.indice].gf) return hth[b.indice].gf - hth[a.indice].gf;

        // d) DG general
        const dgA = a.gf - a.gc;
        const dgB = b.gf - b.gc;
        if (dgB !== dgA) return dgB - dgA;

        // e) GF general
        if (b.gf !== a.gf) return b.gf - a.gf;

        // Sin resolver - empate técnico
        return 0;
      });

      return equipos;
    }

    function actualizarTabla(letra) {
      const equipos = calcularPosiciones(letra);
      const tbody = document.querySelector('#tabla-' + letra);

      // Limpiar el tbody completamente
      tbody.innerHTML = '';

      // Reconstruir las filas en el nuevo orden
      equipos.forEach(function (equipo, pos) {
        const dg = equipo.gf - equipo.gc;
        const dgTexto = dg > 0 ? '+' + dg : dg;

        const fila = document.createElement('tr');
        fila.id = 'fila-' + letra + '-' + equipo.indice;

        // Color según posición
        if (pos === 0 || pos === 1) {
          fila.style.backgroundColor = '#d4edda'; // verde - clasifican directo
        } else if (pos === 2) {
          fila.style.backgroundColor = '#fff3cd'; // amarillo - posible mejor tercero
        }

        fila.innerHTML = `
      <td>${pos + 1}</td>
      <td>${equipo.bandera} ${equipo.nombre}</td>
      <td>${equipo.j}</td>
      <td>${equipo.g}</td>
      <td>${equipo.e}</td>
      <td>${equipo.p}</td>
      <td>${equipo.gf}</td>
      <td>${equipo.gc}</td>
      <td>${dgTexto}</td>
      <td><strong>${equipo.pts}</strong></td>
    `;

        tbody.appendChild(fila);
      });
    }

    function actualizarTerceros() {
      const terceros = [];

      Object.keys(GRUPOS).forEach(function (letra) {
        const equipos = calcularPosiciones(letra);
        const tercero = equipos[2];
        tercero.grupo = letra;
        terceros.push(tercero);
      });

      terceros.sort(function (a, b) {
        if (b.pts !== a.pts) return b.pts - a.pts;
        const dgA = a.gf - a.gc;
        const dgB = b.gf - b.gc;
        if (dgB !== dgA) return dgB - dgA;
        return b.gf - a.gf;
      });

      const tbody = document.getElementById('tabla-terceros');
      tbody.innerHTML = '';

      terceros.forEach(function (equipo, pos) {
        const dg = equipo.gf - equipo.gc;
        const dgTexto = dg > 0 ? '+' + dg : dg;
        const clasifica = pos < 8;

        const fila = document.createElement('tr');
        if (clasifica) {
          fila.style.backgroundColor = '#d4edda';
        }

        fila.innerHTML = `
      <td>${pos + 1}</td>
      <td>${equipo.bandera} ${equipo.nombre}</td>
      <td>${equipo.grupo}</td>
      <td><strong>${equipo.pts}</strong></td>
      <td>${equipo.j}</td>
      <td>${equipo.g}</td>
      <td>${equipo.e}</td>
      <td>${equipo.p}</td>
      <td>${equipo.gf}</td>
      <td>${equipo.gc}</td>
      <td>${dgTexto}</td>
      <td>${clasifica ? '✅ Clasifica' : '❌ Eliminado'}</td>
    `;

        tbody.appendChild(fila);
      });
      // Mostrar rival en tabla de terceros
      const cruces = obtenerCrucesConTerceros();
      // cruces = [1A,1B,1D,1E,1G,1I,1K,1L] en ese orden
      const primeros = ['1A', '1B', '1D', '1E', '1G', '1I', '1K', '1L'];

      if (cruces) {
        const filas = document.querySelectorAll('#tabla-terceros tr');
        filas.forEach(function (fila, i) {
          if (i >= 8) return;
          const grupo = terceros[i].grupo;
          const posEnCruces = cruces.indexOf('3' + grupo);
          if (posEnCruces !== -1) {
            const rival = primeros[posEnCruces];
            const ultima = fila.querySelector('td:last-child');
            if (ultima) ultima.textContent = 'vs ' + rival;
          }
        });
      }
    }

    function obtenerCrucesConTerceros() {
      const terceros = [];
      Object.keys(GRUPOS).forEach(function (letra) {
        const equipos = calcularPosiciones(letra);
        const tercero = equipos[2];
        tercero.grupo = letra;
        terceros.push(tercero);
      });

      terceros.sort(function (a, b) {
        if (b.pts !== a.pts) return b.pts - a.pts;
        const dgA = a.gf - a.gc;
        const dgB = b.gf - b.gc;
        if (dgB !== dgA) return dgB - dgA;
        return b.gf - a.gf;
      });

      const top8 = terceros.slice(0, 8);
      const clave = top8.map(e => e.grupo).sort().join('');
      return TABLA_TERCEROS[clave] || null;
    }

      `;

      if (!confirm('¿Seguro que quieres reiniciar todos los resultados?')) return;
      localStorage.removeItem('mundial2026-grupos');

      // Limpiar todos los inputs
      document.querySelectorAll('.partido-score').forEach(function (input) {

      // Recalcular todo en cero
      Object.keys(GRUPOS).forEach(function (letra) {
        actualizarTabla(letra);

      actualizarTerceros();
      verificarCompleto();

    function verificarCompleto() {
      let total = 0;
      let llenos = 0;

      Object.keys(GRUPOS).forEach(function (letra) {
        PARTIDOS.forEach(function (par, mi) {
          const inputH = document.getElementById('score-' + letra + '-' + mi + '-h');
          const inputA = document.getElementById('score-' + letra + '-' + mi + '-a');
          total += 2;
          if (inputH && inputH.value !== '') llenos++;
          if (inputA && inputA.value !== '') llenos++;
        });
      });

      const btn = document.getElementById('btn-siguiente');
      if (llenos >= total) {
        btn.removeAttribute('disabled');
        btn.style.backgroundColor = '#27ae60';
        btn.style.cursor = 'pointer';
        btn.style.opacity = '1';
      } else {
        btn.setAttribute('disabled', 'disabled');
        btn.style.backgroundColor = '#aaa';
        btn.style.cursor = 'not-allowed';
        btn.style.opacity = '0.6';
      }
    }

    function siguienteRonda(restaurar) {
      document.getElementById('grupos-container').style.display = 'none';
      document.getElementById('terceros-section').style.display = 'none';
      document.getElementById('controles').style.display = 'none';
      document.getElementById('eliminatorias-section').style.display = 'block';

      if (restaurar) {
        // Solo renderizar con el estado guardado
        renderizarBracket(
          ['I1', 'I2', 'I3', 'I4', 'I5', 'I6', 'I7', 'I8'].map(function (id) { return { id: id }; }),
          ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8'].map(function (id) { return { id: id }; })
        );
      } else {
        construirBracket();
      }

      guardarEstado();
    }

    function regresarGrupos() {
      document.getElementById('grupos-container').style.display = 'grid';
      document.getElementById('terceros-section').style.display = 'block';
      document.getElementById('controles').style.display = 'flex';
      document.getElementById('eliminatorias-section').style.display = 'none';
    }

    function obtenerClasificados() {
      const clasificados = {};

      // Primeros y segundos de cada grupo
      Object.keys(GRUPOS).forEach(function (letra) {
        const equipos = calcularPosiciones(letra);
        clasificados['1' + letra] = equipos[0];
        clasificados['2' + letra] = equipos[1];
      });

      // Terceros clasificados
      const terceros = [];
      Object.keys(GRUPOS).forEach(function (letra) {
        const equipos = calcularPosiciones(letra);
        const tercero = equipos[2];
        tercero.grupo = letra;
        terceros.push(tercero);
      });
      terceros.sort(function (a, b) {
        if (b.pts !== a.pts) return b.pts - a.pts;
        const dgA = a.gf - a.gc;
        const dgB = b.gf - b.gc;
        if (dgB !== dgA) return dgB - dgA;
        return b.gf - a.gf;
      });
      terceros.slice(0, 8).forEach(function (t) {
        clasificados['3' + t.grupo] = t;
      });

      return clasificados;
    }

    // Estado global de la eliminatoria
    let estadoEliminatoria = {};

    function construirBracket() {
      estadoEliminatoria = {};
      const clasificados = obtenerClasificados();
      const cruces = obtenerCrucesConTerceros();

      // Definir los 16 cruces de R32
      // Mitad izquierda (8 cruces)
      const r32Izq = [
        { id: 'I1', local: '1E', visitante: cruces ? cruces[3] : '3?' },
        { id: 'I2', local: '1I', visitante: cruces ? cruces[5] : '3?' },
        { id: 'I3', local: '2A', visitante: '2B' },
        { id: 'I4', local: '1F', visitante: '2C' },
        { id: 'I5', local: '2K', visitante: '2L' },
        { id: 'I6', local: '1H', visitante: '2J' },
        { id: 'I7', local: '1D', visitante: cruces ? cruces[2] : '3?' },
        { id: 'I8', local: '1G', visitante: cruces ? cruces[4] : '3?' },
      ];

      // Mitad derecha (8 cruces)
      const r32Der = [
        { id: 'D1', local: '1C', visitante: '2F' },
        { id: 'D2', local: '2E', visitante: '2I' },
        { id: 'D3', local: '1A', visitante: cruces ? cruces[0] : '3?' },
        { id: 'D4', local: '1L', visitante: cruces ? cruces[7] : '3?' },
        { id: 'D5', local: '1J', visitante: '2H' },
        { id: 'D6', local: '2D', visitante: '2G' },
        { id: 'D7', local: '1B', visitante: cruces ? cruces[1] : '3?' },
        { id: 'D8', local: '1K', visitante: cruces ? cruces[6] : '3?' },
      ];

      // Inicializar estado con equipos reales
      function iniciarCruce(cruce) {
        const equipoL = clasificados[cruce.local];
        const equipoV = clasificados[cruce.visitante];
        estadoEliminatoria[cruce.id] = {
          equipoL: equipoL ? equipoL.bandera + ' ' + equipoL.nombre : cruce.local,
          equipoV: equipoV ? equipoV.bandera + ' ' + equipoV.nombre : cruce.visitante,
          golL: '', golV: '', ganador: null
        };
      }

      r32Izq.forEach(iniciarCruce);
      r32Der.forEach(iniciarCruce);

      // Cruces de octavos (ganadores de R32)
      // Izquierda: I1vsI2, I3vsI4, I5vsI6, I7vsI8
      ['OI1', 'OI2', 'OI3', 'OI4', 'OD1', 'OD2', 'OD3', 'OD4'].forEach(function (id) {
        estadoEliminatoria[id] = { equipoL: '?', equipoV: '?', golL: '', golV: '', ganador: null };
      });
      // Cuartos
      ['QI1', 'QI2', 'QD1', 'QD2'].forEach(function (id) {
        estadoEliminatoria[id] = { equipoL: '?', equipoV: '?', golL: '', golV: '', ganador: null };
      });
      // Semis
      ['SI', 'SD'].forEach(function (id) {
        estadoEliminatoria[id] = { equipoL: '?', equipoV: '?', golL: '', golV: '', ganador: null };
      });
      // Tercer lugar y Final
      ['3ER', 'FIN'].forEach(function (id) {
        estadoEliminatoria[id] = { equipoL: '?', equipoV: '?', golL: '', golV: '', ganador: null };
      });

      renderizarBracket(r32Izq, r32Der);
    }

    function nombreEquipo(id) {
      return estadoEliminatoria[id] ? estadoEliminatoria[id].equipoL || '?' : '?';
    }

    function renderizarBracket(r32Izq, r32Der) {
      const contenedor = document.getElementById('bracket-container');
      contenedor.innerHTML = '';

      const wrapper = document.createElement('div');
      wrapper.className = 'bracket-rondas';

      // MITAD IZQUIERDA
      const mitadIzq = document.createElement('div');
      mitadIzq.className = 'bracket-mitad';

      // R32 izquierda
      const colR32Izq = crearColumnaRonda('R32', r32Izq.map(c => c.id));
      // Octavos izquierda
      const colO8Izq = crearColumnaRonda('Octavos', ['OI1', 'OI2', 'OI3', 'OI4']);
      // Cuartos izquierda
      const colQ4Izq = crearColumnaRonda('Cuartos', ['QI1', 'QI2']);
      // Semis izquierda
      const colSIzq = crearColumnaRonda('Semis', ['SI']);

      mitadIzq.appendChild(colR32Izq);
      mitadIzq.appendChild(colO8Izq);
      mitadIzq.appendChild(colQ4Izq);
      mitadIzq.appendChild(colSIzq);

      // CENTRO (Final + 3er lugar)
      const centro = document.createElement('div');
      centro.className = 'bracket-final';

      const cardFinal = document.createElement('div');
      cardFinal.className = 'final-card';
      cardFinal.id = 'card-FIN';
      cardFinal.innerHTML = `
  <div class="final-titulo">🏆 FINAL</div>
  ${crearCruceHTML('FIN')}
  
`;

      const card3er = document.createElement('div');
      card3er.className = 'final-card';
      card3er.id = 'card-3ER';
      card3er.innerHTML = `
  <div class="final-titulo tercer-titulo">🥉 3er lugar</div>
  ${crearCruceHTML('3ER')}
`;

      centro.appendChild(cardFinal);
      centro.appendChild(card3er);

      // MITAD DERECHA
      const mitadDer = document.createElement('div');
      mitadDer.className = 'bracket-mitad derecha';

      const colR32Der = crearColumnaRonda('R32', r32Der.map(c => c.id));
      const colO8Der = crearColumnaRonda('Octavos', ['OD1', 'OD2', 'OD3', 'OD4']);
      const colQ4Der = crearColumnaRonda('Cuartos', ['QD1', 'QD2']);
      const colSDer = crearColumnaRonda('Semis', ['SD']);

      mitadDer.appendChild(colR32Der);
      mitadDer.appendChild(colO8Der);
      mitadDer.appendChild(colQ4Der);
      mitadDer.appendChild(colSDer);

      wrapper.appendChild(mitadIzq);
      wrapper.appendChild(centro);
      wrapper.appendChild(mitadDer);
      contenedor.appendChild(wrapper);

      // Agregar eventos
      contenedor.querySelectorAll('.cruce-input').forEach(function (input) {
        input.addEventListener('input', function () {
          const id = this.dataset.id;
          const lado = this.dataset.lado;
          estadoEliminatoria[id]['gol' + lado] = this.value;
          evaluarResultado(id);
          guardarEstado();
        });
      });

      contenedor.querySelectorAll('.penal-check').forEach(function (cb) {
        cb.addEventListener('change', function () {
          const id = this.dataset.id;
          const lado = this.dataset.lado;
          // Desmarcar el otro
          const otro = lado === 'L' ? 'V' : 'L';
          const otroCheck = contenedor.querySelector(
            `.penal-check[data-id="${id}"][data-lado="${otro}"]`
          );
          if (otroCheck) otroCheck.checked = false;
          evaluarResultado(id);
        });
      });
      actualizarBloqueos();
    }

    function crearColumnaRonda(titulo, ids) {
      const col = document.createElement('div');
      col.className = 'ronda-col';

      const t = document.createElement('div');
      t.className = 'ronda-titulo';
      t.textContent = titulo;
      col.appendChild(t);

      ids.forEach(function (id) {
        const card = document.createElement('div');
        card.className = 'cruce-card';
        card.id = 'card-' + id;
        card.innerHTML = crearCruceHTML(id);
        col.appendChild(card);
      });

      return col;
    }

    function crearCruceHTML(id) {
      const e = estadoEliminatoria[id];
      if (!e) return '';
      const ganadorL = e.ganador === 'L';
      const ganadorV = e.ganador === 'V';

      return `
    <div class="cruce-linea ${ganadorL ? 'ganador' : ''}">
      <span class="cruce-nombre" title="${e.equipoL}">${e.equipoL}</span>
      <input class="cruce-input" type="number" min="0" max="99"
             data-id="${id}" data-lado="L"
             value="${e.golL}" placeholder="-">
    </div>
    <div class="cruce-linea ${ganadorV ? 'ganador' : ''}">
      <span class="cruce-nombre" title="${e.equipoV}">${e.equipoV}</span>
      <input class="cruce-input" type="number" min="0" max="99"
             data-id="${id}" data-lado="V"
             value="${e.golV}" placeholder="-">
    </div>
    <div class="penales-row ${(e.golL !== '' && e.golV !== '' && e.golL === e.golV) ? 'visible' : ''}" id="penales-${id}">
      <span>Penales:</span>
      <label class="penales-check">
        <input type="checkbox" class="penal-check"
               data-id="${id}" data-lado="L"
               ${e.ganador === 'L' && e.golL === e.golV ? 'checked' : ''}>
        Local
      </label>
      <label class="penales-check">
        <input type="checkbox" class="penal-check"
               data-id="${id}" data-lado="V"
               ${e.ganador === 'V' && e.golL === e.golV ? 'checked' : ''}>
        Visit.
      </label>
    </div>
  `;
    }

    function evaluarResultado(id) {
      const e = estadoEliminatoria[id];
      const gL = parseInt(e.golL);
      const gV = parseInt(e.golV);

      if (isNaN(gL) || isNaN(gV)) {
        e.ganador = null;
        actualizarProgresion(id, null);
        rerenderCard(id);
        return;
      }

      // Mostrar/ocultar penales
      const penalesRow = document.getElementById('penales-' + id);
      if (penalesRow) {
        if (gL === gV) {
          penalesRow.classList.add('visible');
        } else {
          penalesRow.classList.remove('visible');
        }
      }

      if (gL > gV) {
        e.ganador = 'L';
      } else if (gV > gL) {
        e.ganador = 'V';
      } else {
        // Empate — ver penales
        const checkL = document.querySelector(`.penal-check[data-id="${id}"][data-lado="L"]`);
        const checkV = document.querySelector(`.penal-check[data-id="${id}"][data-lado="V"]`);
        if (checkL && checkL.checked) e.ganador = 'L';
        else if (checkV && checkV.checked) e.ganador = 'V';
        else e.ganador = null;
      }

      rerenderCard(id);
      actualizarProgresion(id, e.ganador ? (e.ganador === 'L' ? e.equipoL : e.equipoV) : null);
    }

    function rerenderCard(id) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const e = estadoEliminatoria[id];

  const inputL = card.querySelector('[data-lado="L"]');
  const inputV = card.querySelector('[data-lado="V"]');
  const lineaL = card.querySelectorAll('.cruce-linea')[0];
  const lineaV = card.querySelectorAll('.cruce-linea')[1];
  const nombreL = card.querySelectorAll('.cruce-nombre')[0];
  const nombreV = card.querySelectorAll('.cruce-nombre')[1];
  const penalesRow = card.querySelector('.penales-row');

  // Actualizar nombres (por si vienen de progresión)
  if (nombreL) {
    nombreL.textContent = e.equipoL;
    nombreL.title = e.equipoL;
  }
  if (nombreV) {
    nombreV.textContent = e.equipoV;
    nombreV.title = e.equipoV;
  }

  // Actualizar valores de los inputs SOLO si difieren (evita perder el cursor)
  if (inputL && inputL.value !== e.golL) inputL.value = e.golL;
  if (inputV && inputV.value !== e.golV) inputV.value = e.golV;

  // Actualizar colores de ganador
  if (lineaL) lineaL.classList.toggle('ganador', e.ganador === 'L');
  if (lineaV) lineaV.classList.toggle('ganador', e.ganador === 'V');

  // Mostrar/ocultar fila de penales
  if (penalesRow) {
    const empate = e.golL !== '' && e.golV !== '' && e.golL === e.golV;
    penalesRow.classList.toggle('visible', empate);

    const checkL = penalesRow.querySelector('[data-lado="L"]');
    const checkV = penalesRow.querySelector('[data-lado="V"]');
    if (checkL) checkL.checked = (e.ganador === 'L' && empate);
    if (checkV) checkV.checked = (e.ganador === 'V' && empate);
  }
}

    // Mapa de progresión: qué cruce alimenta a cuál y en qué posición
    const PROGRESION = {
      'I1': { siguiente: 'OI1', pos: 'L' },
      'I2': { siguiente: 'OI1', pos: 'V' },
      'I3': { siguiente: 'OI2', pos: 'L' },
      'I4': { siguiente: 'OI2', pos: 'V' },
      'I5': { siguiente: 'OI3', pos: 'L' },
      'I6': { siguiente: 'OI3', pos: 'V' },
      'I7': { siguiente: 'OI4', pos: 'L' },
      'I8': { siguiente: 'OI4', pos: 'V' },
      'OI1': { siguiente: 'QI1', pos: 'L' },
      'OI2': { siguiente: 'QI1', pos: 'V' },
      'OI3': { siguiente: 'QI2', pos: 'L' },
      'OI4': { siguiente: 'QI2', pos: 'V' },
      'QI1': { siguiente: 'SI', pos: 'L' },
      'QI2': { siguiente: 'SI', pos: 'V' },
      'SI': { siguiente: 'FIN', pos: 'L', perdedor: '3ER', perdedorPos: 'L' },
      'D1': { siguiente: 'OD1', pos: 'L' },
      'D2': { siguiente: 'OD1', pos: 'V' },
      'D3': { siguiente: 'OD2', pos: 'L' },
      'D4': { siguiente: 'OD2', pos: 'V' },
      'D5': { siguiente: 'OD3', pos: 'L' },
      'D6': { siguiente: 'OD3', pos: 'V' },
      'D7': { siguiente: 'OD4', pos: 'L' },
      'D8': { siguiente: 'OD4', pos: 'V' },
      'OD1': { siguiente: 'QD1', pos: 'L' },
      'OD2': { siguiente: 'QD1', pos: 'V' },
      'OD3': { siguiente: 'QD2', pos: 'L' },
      'OD4': { siguiente: 'QD2', pos: 'V' },
      'QD1': { siguiente: 'SD', pos: 'L' },
      'QD2': { siguiente: 'SD', pos: 'V' },
      'SD': { siguiente: 'FIN', pos: 'V', perdedor: '3ER', perdedorPos: 'V' },
    };

    function actualizarProgresion(id, ganadorNombre) {
      const prog = PROGRESION[id];
      if (!prog) return;

      const e = estadoEliminatoria[id];
      const perdedorNombre = e.ganador === 'L' ? e.equipoV : e.equipoL;

      // Actualizar ganador en siguiente ronda
      const sig = estadoEliminatoria[prog.siguiente];
      if (sig) {
        if (prog.pos === 'L') {
          sig.equipoL = ganadorNombre || '?';
        } else {
          sig.equipoV = ganadorNombre || '?';
        }
        sig.golL = '';
        sig.golV = '';
        sig.ganador = null;
        rerenderCard(prog.siguiente);
      }

      // Actualizar perdedor en 3er lugar (semis)
      if (prog.perdedor) {
        const ter = estadoEliminatoria[prog.perdedor];
        if (ter) {
          if (prog.perdedorPos === 'L') {
            ter.equipoL = ganadorNombre ? perdedorNombre : '?';
          } else {
            ter.equipoV = ganadorNombre ? perdedorNombre : '?';
          }
          ter.golL = '';
          ter.golV = '';
          ter.ganador = null;
          rerenderCard(prog.perdedor);
        }
      }

      // Bloquear/desbloquear rondas
      actualizarBloqueos();
    }

    function actualizarBloqueos() {
      // Orden de rondas por mitad
      const rondasIzq = [
        ['I1', 'I2', 'I3', 'I4', 'I5', 'I6', 'I7', 'I8'],
        ['OI1', 'OI2', 'OI3', 'OI4'],
        ['QI1', 'QI2'],
        ['SI']
      ];
      const rondasDer = [
        ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8'],
        ['OD1', 'OD2', 'OD3', 'OD4'],
        ['QD1', 'QD2'],
        ['SD']
      ];

      function bloquearRonda(ids, bloqueado) {
        ids.forEach(function (id) {
          const card = document.getElementById('card-' + id);
          if (!card) return;
          card.querySelectorAll('.cruce-input').forEach(function (input) {
            input.disabled = bloqueado;
            input.style.backgroundColor = bloqueado ? '#eee' : 'white';
            input.style.color = bloqueado ? '#aaa' : '#000';
          });
          card.querySelectorAll('.penal-check').forEach(function (cb) {
            cb.disabled = bloqueado;
          });
        });
      }

      function rondaCompleta(ids) {
        return ids.every(function (id) {
          return estadoEliminatoria[id] && estadoEliminatoria[id].ganador !== null;
        });
      }

      // Procesar mitad izquierda
      for (let i = 0; i < rondasIzq.length; i++) {
        const anterior = i === 0 ? null : rondasIzq[i - 1];
        const actual = rondasIzq[i];
        const bloqueado = anterior ? !rondaCompleta(anterior) : false;
        bloquearRonda(actual, bloqueado);
      }

      // Procesar mitad derecha
      for (let i = 0; i < rondasDer.length; i++) {
        const anterior = i === 0 ? null : rondasDer[i - 1];
        const actual = rondasDer[i];
        const bloqueado = anterior ? !rondaCompleta(anterior) : false;
        bloquearRonda(actual, bloqueado);
      }

      // Final y 3er lugar: bloqueados hasta que ambas semis estén completas
      const semifinalesCompletas = rondaCompleta(['SI']) && rondaCompleta(['SD']);
      const cardFin = document.getElementById('card-FIN');
      const card3er = document.getElementById('card-3ER');

      [cardFin, card3er].forEach(function (card) {
        if (!card) return;
        card.querySelectorAll('.cruce-input').forEach(function (input) {
          input.disabled = !semifinalesCompletas;
          input.style.backgroundColor = !semifinalesCompletas ? '#eee' : 'white';
          input.style.color = !semifinalesCompletas ? '#aaa' : '#000';
        });
        card.querySelectorAll('.penal-check').forEach(function (cb) {
          cb.disabled = !semifinalesCompletas;
        });
      });
    }

    function guardarEstado() {
      const datos = {};
      Object.keys(GRUPOS).forEach(function (letra) {
        PARTIDOS.forEach(function (par, mi) {
          const inputH = document.getElementById('score-' + letra + '-' + mi + '-h');
          const inputA = document.getElementById('score-' + letra + '-' + mi + '-a');
          if (inputH) datos['score-' + letra + '-' + mi + '-h'] = inputH.value;
          if (inputA) datos['score-' + letra + '-' + mi + '-a'] = inputA.value;
        });
      });
      localStorage.setItem('mundial2026-grupos', JSON.stringify(datos));

      // Guardar también si estamos en eliminatorias
      if (Object.keys(estadoEliminatoria).length > 0) {
        localStorage.setItem('mundial2026-eliminatorias', JSON.stringify(estadoEliminatoria));
      }
    }

    function restaurarEstado() {
      const datosGrupos = localStorage.getItem('mundial2026-grupos');
      if (!datosGrupos) return false;

      const datos = JSON.parse(datosGrupos);
      let hayDatos = false;

      Object.keys(datos).forEach(function (id) {
        const input = document.getElementById(id);
        if (input && datos[id] !== '') {
          input.value = datos[id];
          hayDatos = true;
        }
      });

      if (hayDatos) {
        // Recalcular todas las tablas con los datos restaurados
        Object.keys(GRUPOS).forEach(function (letra) {
          actualizarTabla(letra);
        });
        actualizarTerceros();
        verificarCompleto();
      }

      // Restaurar eliminatorias si estaban abiertas
      const datosElim = localStorage.getItem('mundial2026-eliminatorias');
      if (datosElim) {
        const confirmado = confirm('Tienes una fase eliminatoria en progreso. ¿Quieres continuar desde donde dejaste?');
        if (confirmado) {
          estadoEliminatoria = JSON.parse(datosElim);
          siguienteRonda(true); // true = restaurar sin recalcular
        }
      }

      return hayDatos;
    }

    function capturarSeccion(tipo) {
  const boton = tipo === 'grupos' 
    ? document.getElementById('btn-captura-grupos')
    : document.querySelector('#controles-eliminatorias .btn-captura-bracket');
  
  if (boton) {
    boton.textContent = '⏳ Generando...';
    boton.disabled = true;
  }

  if (tipo === 'grupos') {
    const grupos = document.getElementById('grupos-container');
    const terceros = document.getElementById('terceros-section');

    // Guardar estilos originales
    const estiloOriginalGrupos = grupos.style.cssText;
    const estiloOriginalTerceros = terceros.style.cssText;

    // Forzar 3 columnas y ancho fijo temporalmente
    grupos.style.gridTemplateColumns = 'repeat(3, 1fr)';
    grupos.style.width = '1400px';

    grupos.querySelectorAll('.grupo-contenido').forEach(function(gc) {
      gc.style.gridTemplateColumns = '1fr 1fr';
    });

    terceros.style.width = '1400px';

    setTimeout(function() {
      html2canvas(document.body, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#f0f0f0',
        x: grupos.getBoundingClientRect().left + window.scrollX,
        y: grupos.getBoundingClientRect().top + window.scrollY,
        width: 1400,
        height: (terceros.getBoundingClientRect().bottom - grupos.getBoundingClientRect().top),
        windowWidth: 1400
      }).then(function(canvas) {
        const link = document.createElement('a');
        link.download = 'mundial2026-grupos.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        // Restaurar estilos
        grupos.style.cssText = estiloOriginalGrupos;
        terceros.style.cssText = estiloOriginalTerceros;
        grupos.querySelectorAll('.grupo-contenido').forEach(function(gc) {
          gc.style.gridTemplateColumns = '';
        });

        if (boton) {
          boton.textContent = '📷 Capturar grupos';
          boton.disabled = false;
        }
      });
    }, 300);

  } else if (tipo === 'bracket') {
    const bracket = document.getElementById('bracket-container');
    const wrapper = bracket.querySelector('.bracket-rondas');

    const estiloOriginalBracket = bracket.style.cssText;
    const anchoTotal = wrapper.scrollWidth;
    const altoTotal = wrapper.scrollHeight;

    // Forzar que se muestre todo sin scroll
    bracket.style.overflow = 'visible';
    bracket.style.width = anchoTotal + 'px';

    setTimeout(function() {
      html2canvas(document.body, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#f0f0f0',
        x: bracket.getBoundingClientRect().left + window.scrollX,
        y: bracket.getBoundingClientRect().top + window.scrollY,
        width: anchoTotal,
        height: altoTotal,
        windowWidth: anchoTotal
      }).then(function(canvas) {
        const link = document.createElement('a');
        link.download = 'mundial2026-bracket.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        bracket.style.cssText = estiloOriginalBracket;

        if (boton) {
          boton.textContent = '📷 Capturar bracket';
          boton.disabled = false;
        }
      });
    }, 300);
  }
}

    renderizarGrupos();
    actualizarTerceros();
    verificarCompleto();
    restaurarEstado();
  </script>
